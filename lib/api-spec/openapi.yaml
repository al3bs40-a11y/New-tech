openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: User authentication
  - name: dashboard
    description: Dashboard summaries and activity
  - name: products
    description: Inventory and products
  - name: sales
    description: Point of sale and invoices
  - name: settlements
    description: Sales proceeds settlements
  - name: expenses
    description: Store expenses
  - name: customers
    description: Customer records
  - name: storage
    description: Protected object uploads and file serving
paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to NEWTECH
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
  /auth/login-options:
    get:
      operationId: getLoginOptions
      tags: [auth]
      summary: List public account labels for the login screen
      security: []
      responses:
        "200":
          description: Account names and usernames that can be selected before sign-in
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoginAccountOption"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
  /auth/account:
    patch:
      operationId: updateAccountProfile
      tags: [auth]
      summary: Update the signed-in user's account name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfileInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "409":
          description: Username already exists
  /auth/account/password:
    put:
      operationId: updateAccountPassword
      tags: [auth]
      summary: Change the signed-in user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Current password is incorrect or new password is invalid
  /auth/admin/sellers:
    get:
      operationId: getAdminSellers
      tags: [auth]
      summary: List seller accounts for the administrator
      responses:
        "200":
          description: Seller accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSellerAccount"
        "403":
          description: Administrator access required
    post:
      operationId: createAdminSeller
      tags: [auth]
      summary: Create a seller account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSellerAccountInput"
      responses:
        "201":
          description: Seller account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSellerAccount"
        "409":
          description: Username already exists
  /auth/admin/sellers/{id}:
    patch:
      operationId: updateAdminSeller
      tags: [auth]
      summary: Change a seller account name
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfileInput"
      responses:
        "200":
          description: Seller account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSellerAccount"
        "404":
          description: Seller account not found
        "409":
          description: Username already exists
    delete:
      operationId: deleteAdminSeller
      tags: [auth]
      summary: Delete a seller account while retaining its operation history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Seller account deleted
        "403":
          description: Administrator access required
        "404":
          description: Seller account not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activities:
    get:
      operationId: getActivities
      tags: [dashboard]
      summary: Get recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Add inventory product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product update or attempted stock quantity change
        "403":
          description: Sellers may only update the selling price
        "404":
          description: Product not found
        "409":
          description: Product barcode is already assigned to another product
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete an unused inventory product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted
        "403":
          description: Administrators only
        "404":
          description: Product not found
        "409":
          description: Product is referenced by sale or adjustment history
  /sales:
    get:
      operationId: getSales
      tags: [sales]
      summary: List sales
      responses:
        "200":
          description: Sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Create sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Sale created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
  /sales/{id}:
    get:
      operationId: getSaleDetails
      tags: [sales]
      summary: Get printable sale details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Printable sale details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleDetail"
        "404":
          description: Sale not found
  /sales/{id}/adjustments:
    post:
      operationId: createSaleAdjustment
      tags: [sales]
      summary: Return or exchange an invoice item
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleAdjustmentInput"
      responses:
        "201":
          description: Return or exchange recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleAdjustment"
        "400":
          description: Invalid adjustment
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [storage]
      summary: Serve a public object
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public file
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: File not found
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve an authenticated private object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Private file
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: File not found
  /reports/summary:
    get:
      operationId: getReportSummary
      tags: [reports]
      summary: Get role-safe report totals
      parameters:
        - in: query
          name: start
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - in: query
          name: end
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Report totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"
  /settlements:
    get:
      operationId: getSettlements
      tags: [settlements]
      summary: List proceeds settlements
      responses:
        "200":
          description: Settlements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Settlement"
    post:
      operationId: createSettlement
      tags: [settlements]
      summary: Record sales proceeds settlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementInput"
      responses:
        "201":
          description: Settlement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlement"
  /expenses:
    get:
      operationId: getExpenses
      tags: [expenses]
      summary: List expenses
      responses:
        "200":
          description: Expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Record expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
  /customers:
    get:
      operationId: getCustomers
      tags: [customers]
      summary: List customers
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /customers/{id}:
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer without outstanding debt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Customer deleted
        "403":
          description: Administrators only
        "404":
          description: Customer not found
        "409":
          description: Customer has an outstanding balance or invoice
components:
  schemas:
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 60 }
        password: { type: string, minLength: 1 }
    AuthUser:
      type: object
      required: [id, username, displayName, role]
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, seller] }
    AuthSession:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
    LoginAccountOption:
      type: object
      required: [username, displayName, role]
      properties:
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, seller] }
    AccountProfileInput:
      type: object
      required: [username, displayName]
      properties:
        username: { type: string, minLength: 3, maxLength: 60 }
        displayName: { type: string, minLength: 2, maxLength: 100 }
    AccountPasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    CreateSellerAccountInput:
      type: object
      required: [username, displayName, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 60 }
        displayName: { type: string, minLength: 2, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 128 }
    AdminSellerAccount:
      type: object
      required: [id, username, displayName, role, createdAt]
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [seller] }
        createdAt: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DashboardSummary:
      type: object
      required:
        - salesToday
        - salesMonth
        - cashBalance
        - bankakBalance
        - liquidity
        - inventoryValue
        - salesProceeds
        - omarSettlements
        - saifSettlements
        - unsettled
        - expenses
        - netProfit
        - salesTrend
        - paymentBreakdown
      properties:
        salesToday: { type: number }
        salesMonth: { type: number }
        cashBalance: { type: number }
        bankakBalance: { type: number }
        liquidity: { type: number }
        inventoryValue: { type: number }
        salesProceeds: { type: number }
        omarSettlements: { type: number }
        saifSettlements: { type: number }
        unsettled: { type: number }
        expenses: { type: number }
        netProfit: { type: number }
        salesTrend:
          type: array
          items: { $ref: "#/components/schemas/TrendPoint" }
        paymentBreakdown:
          type: array
          items: { $ref: "#/components/schemas/PaymentBreakdown" }
    TrendPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    PaymentBreakdown:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    Activity:
      type: object
      required: [id, type, title, description, amount, createdAt, actorDisplayName, actorUsername]
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        amount: { type: number }
        createdAt: { type: string }
        actorDisplayName: { type: ["string", "null"] }
        actorUsername: { type: ["string", "null"] }
    Product:
      type: object
      required: [id, name, category, brand, model, specification, unit, quantity, price, payable, profit, costKnown, status, barcode]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        brand: { type: string }
        model: { type: string }
        specification: { type: string }
        unit: { type: string }
        quantity: { type: number }
        price: { type: number }
        payable: { type: number }
        profit: { type: number }
        costKnown: { type: boolean }
        status: { type: string }
        barcode: { type: string }
        imei: { type: ["string", "null"] }
        serialNumber: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
    ProductInput:
      type: object
      required: [name, category, brand, model, specification, unit, quantity, price]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string }
        brand: { type: string }
        model: { type: string }
        specification: { type: string }
        unit: { type: string }
        quantity: { type: number, minimum: 0 }
        price: { type: number, minimum: 0 }
        payable: { type: number, minimum: 0 }
        barcode: { type: string, minLength: 1 }
        imei: { type: ["string", "null"] }
        serialNumber: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
    ProductUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        brand: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        specification: { type: string, minLength: 1 }
        unit: { type: string, minLength: 1 }
        price: { type: number, minimum: 0 }
        payable: { type: number, minimum: 0 }
        status: { type: string }
        barcode: { type: string, minLength: 1 }
        imei: { type: ["string", "null"], minLength: 1 }
        serialNumber: { type: ["string", "null"], minLength: 1 }
    Sale:
      type: object
      required: [id, invoiceNumber, customerName, total, adjustedTotal, netPaid, paidCash, paidBankak, remaining, creditApplied, paymentMethod, createdAt]
      properties:
        id: { type: integer }
        invoiceNumber: { type: string }
        customerName: { type: string }
        total: { type: number }
        adjustedTotal: { type: number }
        netPaid: { type: number }
        paidCash: { type: number }
        paidBankak: { type: number }
        remaining: { type: number }
        creditApplied: { type: number }
        paymentMethod: { type: string }
        employeeName: { type: string }
        createdAt: { type: string }
    SaleDetail:
      type: object
      required: [id, invoiceNumber, customerName, subtotal, discount, total, paidCash, paidBankak, remaining, creditApplied, paymentMethod, employeeName, createdAt, items, adjustments]
      properties:
        id: { type: integer }
        invoiceNumber: { type: string }
        customerName: { type: string }
        customerPhone: { type: ["string", "null"] }
        subtotal: { type: number }
        discount: { type: number }
        total: { type: number }
        paidCash: { type: number }
        paidBankak: { type: number }
        remaining: { type: number }
        creditApplied: { type: number }
        paymentMethod: { type: string }
        employeeName: { type: string }
        createdAt: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/SaleLine" }
        adjustments:
          type: array
          items: { $ref: "#/components/schemas/SaleAdjustment" }
    SaleLine:
      type: object
      required: [id, productId, productName, quantity, unitPrice, lineTotal, returnedQuantity]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        lineTotal: { type: number }
        returnedQuantity: { type: number }
    SaleAdjustment:
      type: object
      required: [id, saleId, saleItemId, kind, condition, quantity, returnValue, replacementValue, debtReduction, additionalDebt, refundCash, refundBankak, creditRefund, collectionCash, collectionBankak, settlementMethod, refundProofPath, replacementProductId, replacementProductName, replacementQuantity, createdAt, employeeName]
      properties:
        id: { type: integer }
        saleId: { type: integer }
        saleItemId: { type: integer }
        kind: { type: string, enum: [return, exchange] }
        condition: { type: string }
        quantity: { type: number }
        returnValue: { type: number }
        replacementValue: { type: number }
        debtReduction: { type: number }
        additionalDebt: { type: number }
        refundCash: { type: number }
        refundBankak: { type: number }
        creditRefund: { type: number }
        collectionCash: { type: number }
        collectionBankak: { type: number }
        settlementMethod: { type: ["string", "null"] }
        refundProofPath: { type: ["string", "null"] }
        replacementProductId: { type: ["integer", "null"] }
        replacementProductName: { type: ["string", "null"] }
        replacementQuantity: { type: ["number", "null"] }
        createdAt: { type: string }
        employeeName: { type: string }
    SaleAdjustmentInput:
      type: object
      required: [requestId, saleItemId, kind, quantity]
      properties:
        requestId: { type: string, format: uuid }
        saleItemId: { type: integer }
        kind: { type: string, enum: [return, exchange] }
        quantity: { type: number, exclusiveMinimum: 0 }
        settlementMethod: { type: ["string", "null"], enum: [كاش, بنكك, رصيد, null] }
        refundProofPath: { type: ["string", "null"] }
        replacementProductId: { type: ["integer", "null"] }
        replacementQuantity: { type: ["number", "null"], exclusiveMinimum: 0 }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata: { $ref: "#/components/schemas/UploadUrlRequest" }
    ReportSummary:
      type: object
      required: [salesTotal, salesCash, salesBankak, salesRemaining, expensesTotal, expensesCash, expensesBankak, invoiceCount, expenseCount]
      properties:
        salesTotal: { type: number }
        salesCash: { type: number }
        salesBankak: { type: number }
        salesRemaining: { type: number }
        expensesTotal: { type: number }
        expensesCash: { type: number }
        expensesBankak: { type: number }
        invoiceCount: { type: integer }
        expenseCount: { type: integer }
        grossProfit: { type: number }
        netProfit: { type: number }
    SaleInput:
      type: object
      required: [customerName, items, paidCash, paidBankak]
      properties:
        customerName: { type: string }
        customerPhone: { type: ["string", "null"] }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SaleItemInput" }
        paidCash: { type: number, minimum: 0 }
        paidBankak: { type: number, minimum: 0 }
        discount: { type: number, minimum: 0 }
    SaleItemInput:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
